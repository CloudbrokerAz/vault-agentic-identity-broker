log_level = "DEBUG"

# The OIDC Discovery Provider serves a JWKS endpoint so that relying
# parties (e.g. Vault JWT auth) can verify SPIRE JWT-SVIDs.

domains = ["spire-oidc", "localhost"]

# Where to serve the OIDC discovery document and JWKS
listen_socket_path = ""

# ACME disabled for local demo
acme {
    directory_url = ""
    email = ""
    tos_accepted = false
}

# Serve via HTTP (no TLS) for the demo environment
insecure_addr = "0.0.0.0:8082"

# Workload API socket to fetch the trust bundle
workload_api {
    socket_path = "/tmp/spire-agent/public/api.sock"
    trust_domain = "demo.local"
}
