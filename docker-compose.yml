###############################################################################
# Vault Agentic Identity Broker - Docker Compose (v2 with AgentGateway)
#
# Architecture: AgentGateway + Token Exchange (RFC 8693) + Sub-Agents
#
# Components:
#   1. spire-server    - SPIFFE trust domain root
#   2. spire-agent     - Workload attestation & SVID distribution
#   3. keycloak        - Human OIDC Identity Provider
#   4. vault           - Dynamic secrets management
#   5. opa             - Policy engine for delegation decisions
#   6. postgresql      - Target database with sample data
#   7. agentgateway    - MCP/A2A proxy with RBAC
#   8. token-exchange  - RFC 8693 Token Exchange Service
#   9. ai-agent        - Demo AI agent with sub-agent delegation
###############################################################################

services:

  # ─── SPIRE Server ──────────────────────────────────────────────────────
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.0
    hostname: spire-server
    command:
      - -config
      - /opt/spire/conf/server/server.conf
    volumes:
      - ./spire/server/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-server-data:/opt/spire/data/server
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - identity-net

  # ─── SPIRE Agent ───────────────────────────────────────────────────────
  # Started by bootstrap.sh after generating a join token from the server.
  # Use: SPIRE_JOIN_TOKEN=xxx docker compose --profile spire up -d spire-agent
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.0
    hostname: spire-agent
    profiles: ["spire"]
    command:
      - -config
      - /opt/spire/conf/agent/agent.conf
      - -joinToken
      - "${SPIRE_JOIN_TOKEN:-}"
    volumes:
      - ./spire/agent/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-agent-data:/opt/spire/data/agent
      - spire-agent-socket:/tmp/spire-agent/public
      - spire-server-data:/opt/spire/data/server:ro
    depends_on:
      spire-server:
        condition: service_healthy
    pid: "host"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - identity-net

  # ─── SPIRE OIDC Discovery Provider ────────────────────────────────────
  # Serves a JWKS endpoint for SPIRE JWT-SVIDs so that Vault (and other
  # relying parties) can verify agent identity tokens cryptographically.
  # Started by bootstrap.sh after the SPIRE agent is healthy.
  spire-oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.11.0
    hostname: spire-oidc
    profiles: ["spire"]
    command:
      - -config
      - /opt/spire/conf/oidc/oidc-discovery-provider.conf
    volumes:
      - ./spire/oidc/oidc-discovery-provider.conf:/opt/spire/conf/oidc/oidc-discovery-provider.conf:ro
      - spire-agent-socket:/tmp/spire-agent/public:ro
    ports:
      - "8082:8082"
    depends_on:
      spire-server:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/keys"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - identity-net

  # ─── Keycloak (Human IdP) ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    hostname: keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm/demo-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - identity-net

  # ─── HashiCorp Vault ───────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    hostname: vault
    command: server
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://vault:8200"
    volumes:
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/policies:/vault/policies:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || [ $? -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - identity-net

  # ─── OPA Policy Engine ────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.70.0
    platform: linux/amd64
    hostname: opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=debug
      - /policies/delegation.rego
      - /policies/data.json
    volumes:
      - ./opa/policies:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 15s
    networks:
      - identity-net

  # ─── PostgreSQL Database ──────────────────────────────────────────────
  postgresql:
    image: postgres:16-alpine
    hostname: postgresql
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-root-password
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - identity-net

  # ─── AgentGateway (MCP/A2A Proxy) ─────────────────────────────────────
  # Open-source proxy (https://github.com/agentgateway/agentgateway)
  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:latest
    hostname: agentgateway
    command:
      - --file
      - /config/gateway.yaml
    volumes:
      - ./agentgateway/config/gateway.yaml:/config/gateway.yaml:ro
      - spire-agent-socket:/tmp/spire-agent/public:ro
    environment:
      KEYCLOAK_ISSUER_URL: "http://keycloak:8080/realms/demo"
      TOKEN_EXCHANGE_URL: "http://token-exchange:8090"
      SPIRE_AGENT_SOCKET: "/tmp/spire-agent/public/api.sock"
    ports:
      - "9080:8080"     # MCP/HTTP agent listener
      - "19000:19000"   # Admin API
    depends_on:
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
      token-exchange:
        condition: service_healthy
    # Note: agentgateway uses a minimal image without curl/wget.
    # Health can be verified externally via http://localhost:19000/ui
    healthcheck:
      disable: true
    networks:
      - identity-net

  # ─── Token Exchange Service (RFC 8693) ─────────────────────────────────
  # New service implementing OAuth 2.0 Token Exchange with delegation
  # semantics for AI agent identity chains
  token-exchange:
    build:
      context: ./token-exchange
      dockerfile: Dockerfile
    hostname: token-exchange
    environment:
      LISTEN_PORT: "8090"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "demo"
      OPA_ENDPOINT: "http://opa:8181"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${GATEWAY_VAULT_TOKEN:-}"
      TRUST_DOMAIN: "demo.local"
      SIGNING_SECRET: "${TOKEN_SIGNING_SECRET:-token-exchange-secret-change-in-production}"
      MAX_DELEGATION_DEPTH: "3"
      DEFAULT_TTL: "300"
      MAX_TTL: "1800"
    ports:
      - "8090:8090"
    depends_on:
      vault:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - identity-net

  # ─── AI Agent (with sub-agent delegation) ──────────────────────────────
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    hostname: ai-agent
    environment:
      AGENT_MODE: "wait"
      # Authentication mode: "device" (recommended), "token", or "password" (demo only)
      AUTH_MODE: "${AUTH_MODE:-device}"
      GATEWAY_URL: "http://token-exchange:8090"
      TOKEN_EXCHANGE_URL: "http://token-exchange:8090"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "demo"
      TRUST_DOMAIN: "demo.local"
      AGENT_SPIFFE_ID: "spiffe://demo.local/agent/query-agent"
      SPIRE_AGENT_SOCKET: "/tmp/spire-agent/public/api.sock"
      DB_HOST: "postgresql"
      DB_PORT: "5432"
      DB_NAME: "appdb"
      # Pre-supplied human token (for AUTH_MODE=token)
      HUMAN_ACCESS_TOKEN: "${HUMAN_ACCESS_TOKEN:-}"
      # Legacy password grant credentials (for AUTH_MODE=password only — DEMO USE)
      DEMO_USERNAME: "${DEMO_USERNAME:-alice}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public:ro
    depends_on:
      token-exchange:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    networks:
      - identity-net

volumes:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  vault-data:
  vault-logs:
  postgres-data:

networks:
  identity-net:
    driver: bridge
