###############################################################################
# Vault Agentic Identity Broker - Docker Compose (Host Network Mode)
#
# This overlay file switches all services to host networking for environments
# where Docker bridge networking is unavailable (e.g., sandboxed/CI).
# Services communicate via localhost with different ports.
###############################################################################

services:

  # ─── SPIRE Volume Init ──────────────────────────────────────────────────
  # SPIRE server image runs as UID 1000:1000; ensure data volume ownership matches.
  spire-init:
    image: alpine:3.20
    command: ["chown", "-R", "1000:1000", "/opt/spire/data/server"]
    volumes:
      - spire-server-data:/opt/spire/data/server
    network_mode: none

  # ─── SPIRE Server ──────────────────────────────────────────────────────
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.0
    command:
      - -config
      - /opt/spire/conf/server/server.conf
    volumes:
      - ./spire/server/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-server-data:/opt/spire/data/server
    depends_on:
      spire-init:
        condition: service_completed_successfully
    network_mode: host
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ─── SPIRE Agent ───────────────────────────────────────────────────────
  # Started by bootstrap.sh after generating a join token from the server.
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.0
    profiles: ["spire"]
    command:
      - -config
      - /opt/spire/conf/agent/agent.conf
      - -joinToken
      - "${SPIRE_JOIN_TOKEN:-}"
    volumes:
      - ./spire/agent/agent-host.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-agent-data:/opt/spire/data/agent
      - /tmp/spire-agent-public:/tmp/spire-agent/public
      - spire-server-data:/opt/spire/data/server:ro
    depends_on:
      spire-server:
        condition: service_healthy
    pid: "host"
    network_mode: host
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ─── SPIRE OIDC Discovery Provider ────────────────────────────────────
  # Started by bootstrap.sh after the SPIRE agent is healthy.
  spire-oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.11.0
    profiles: ["spire"]
    command:
      - -config
      - /opt/spire/conf/oidc/oidc-discovery-provider.conf
    volumes:
      - ./spire/oidc/oidc-discovery-provider.conf:/opt/spire/conf/oidc/oidc-discovery-provider.conf:ro
      - /tmp/spire-agent-public:/tmp/spire-agent/public:ro
    depends_on:
      spire-server:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
    network_mode: host
    healthcheck:
      # Distroless image has no shell/wget/curl; bootstrap verifies via HTTP externally
      disable: true

  # ─── Keycloak (Human IdP) ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm/demo-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ─── HashiCorp Vault ───────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    command: server
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/policies:/vault/policies:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || [ $? -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ─── OPA Policy Engine ────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.70.0
    platform: linux/amd64
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=debug
      - /policies/delegation.rego
      - /policies/data.json
    volumes:
      - ./opa/policies:/policies:ro
    network_mode: host
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 15s

  # ─── PostgreSQL Database ──────────────────────────────────────────────
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-root-password
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── AgentGateway (MCP/A2A Proxy) ─────────────────────────────────────
  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:latest
    command:
      - --file
      - /config/gateway.yaml
    volumes:
      - ./agentgateway/config/gateway-host.yaml:/config/gateway.yaml:ro
      - /tmp/spire-agent-public:/tmp/spire-agent/public:ro
    environment:
      KEYCLOAK_ISSUER_URL: "http://127.0.0.1:8080/realms/demo"
      TOKEN_EXCHANGE_URL: "http://127.0.0.1:8090"
      SPIRE_AGENT_SOCKET: "/tmp/spire-agent/public/api.sock"
    depends_on:
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
      token-exchange:
        condition: service_healthy
    network_mode: host
    healthcheck:
      disable: true

  # ─── Token Exchange Service (RFC 8693) ────────────────────────────────
  token-exchange:
    build:
      context: ./token-exchange
      dockerfile: Dockerfile
    environment:
      LISTEN_PORT: "8090"
      KEYCLOAK_URL: "http://127.0.0.1:8080"
      KEYCLOAK_REALM: "demo"
      OPA_ENDPOINT: "http://127.0.0.1:8181"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: "${GATEWAY_VAULT_TOKEN:-}"
      TRUST_DOMAIN: "demo.local"
      SPIRE_OIDC_URL: "http://127.0.0.1:8082"
      SIGNING_SECRET: "${TOKEN_SIGNING_SECRET:-token-exchange-secret-change-in-production}"
      MAX_DELEGATION_DEPTH: "3"
      DEFAULT_TTL: "300"
      MAX_TTL: "1800"
      MTLS_ENABLED: "${MTLS_ENABLED:-false}"
      SPIRE_AGENT_SOCKET: "/tmp/spire-agent/public/api.sock"
    volumes:
      - /tmp/spire-agent-public:/tmp/spire-agent/public:ro
    depends_on:
      vault:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─── AI Agent ──────────────────────────────────────────────────────────
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    environment:
      AGENT_MODE: "wait"
      AUTH_MODE: "${AUTH_MODE:-device}"
      GATEWAY_URL: "http://127.0.0.1:8090"
      TOKEN_EXCHANGE_URL: "http://127.0.0.1:8090"
      KEYCLOAK_URL: "http://127.0.0.1:8080"
      KEYCLOAK_REALM: "demo"
      TRUST_DOMAIN: "demo.local"
      AGENT_SPIFFE_ID: "spiffe://demo.local/agent/query-agent"
      SPIRE_AGENT_SOCKET: "/tmp/spire-agent/public/api.sock"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: "appdb"
      HUMAN_ACCESS_TOKEN: "${HUMAN_ACCESS_TOKEN:-}"
      DEMO_USERNAME: "${DEMO_USERNAME:-alice}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
    volumes:
      - /tmp/spire-agent-public:/tmp/spire-agent/public:ro
    depends_on:
      token-exchange:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    network_mode: host

  # ─── Test Runner ──────────────────────────────────────────────────────
  test-runner:
    build:
      context: ./tests
      dockerfile: Dockerfile
    profiles: ["test"]
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      PYTHONPATH: "/workspace"
      HOST_NETWORK: "true"
    network_mode: host
    depends_on:
      token-exchange:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  # ─── Interactive Demo UI ─────────────────────────────────────────────
  demo-ui:
    build:
      context: ./demo-ui
      dockerfile: Dockerfile
    profiles: ["demo"]
    environment:
      KEYCLOAK_URL: "http://127.0.0.1:8080"
      TOKEN_EXCHANGE_URL: "http://127.0.0.1:8090"
      OPA_URL: "http://127.0.0.1:8181"
      VAULT_ADDR: "http://127.0.0.1:8200"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: "appdb"
      SPIRE_SOCKET: "/tmp/spire-agent/public/api.sock"
    volumes:
      - /tmp/spire-agent-public:/tmp/spire-agent/public:ro
    depends_on:
      token-exchange:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    network_mode: host

volumes:
  spire-server-data:
  spire-agent-data:
  vault-data:
  vault-logs:
  postgres-data:
