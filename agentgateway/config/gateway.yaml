###############################################################################
# AgentGateway Configuration (v0.12.0)
#
# Open-source AgentGateway
# (https://github.com/agentgateway/agentgateway) - a Rust-based proxy for
# AI agent connectivity supporting MCP and A2A protocols.
#
# Docs: https://agentgateway.dev/docs/configuration/overview/
###############################################################################

# ─── Static Config ───────────────────────────────────────────────────────────
config:
  adminAddr: 0.0.0.0:19000
  readinessAddr: 0.0.0.0:15021
  statsAddr: 0.0.0.0:15020
  logging:
    level: info

# ─── Bind Definitions ────────────────────────────────────────────────────────
binds:
  # ── MCP Agent Listener (Primary) ──
  # AI agents connect here via MCP (SSE or Streamable HTTP)
  - port: 8080
    listeners:
      - name: mcp-listener
        protocol: HTTP
        routes:
          - name: delegation-tools
            policies:
              cors:
                allowOrigins: ["*"]
                allowMethods: ["GET", "POST", "OPTIONS"]
                allowHeaders:
                  - authorization
                  - content-type
                  - mcp-protocol-version
                  - x-request-id
                exposeHeaders:
                  - "Mcp-Session-Id"

              jwtAuth:
                mode: optional
                issuer: "http://keycloak:8080/realms/demo"
                audiences:
                  - ai-agent-service
                  - token-exchange
                jwks:
                  url: "http://keycloak:8080/realms/demo/protocol/openid-connect/certs"

              localRateLimit:
                - maxTokens: 60
                  tokensPerFill: 60
                  fillInterval: 60s
                  type: requests

            backends:
              - mcp:
                  targets:
                    - name: delegation-tools
                      mcp:
                        host: "http://token-exchange:8090/mcp/"

  # ── HTTP API Listener (REST passthrough) ──
  - port: 9080
    listeners:
      - name: rest-listener
        protocol: HTTP
        routes:
          - name: token-exchange-api
            policies:
              jwtAuth:
                mode: optional
                issuer: "http://keycloak:8080/realms/demo"
                audiences:
                  - ai-agent-service
                  - token-exchange
                jwks:
                  url: "http://keycloak:8080/realms/demo/protocol/openid-connect/certs"

              localRateLimit:
                - maxTokens: 120
                  tokensPerFill: 120
                  fillInterval: 60s
                  type: requests

            backends:
              - host: "token-exchange:8090"

# ─── Notes ────────────────────────────────────────────────────────────────────
#
# MCP Tool Catalog (exposed via port 8080):
#   delegation-tools__query_database
#   delegation-tools__get_delegation_status
#   delegation-tools__revoke_credentials
#
# RBAC (JWT group → access):
#   data-analysts  → readonly query_database
#   trading-team   → readonly query_database
#   engineering    → readonly + readwrite query_database, revoke_credentials
#
# SPIFFE agent identities:
#   spiffe://demo.local/agent/query-agent
#   spiffe://demo.local/agent/analysis-agent
#   spiffe://demo.local/agent/write-agent
#   spiffe://demo.local/subagent/sql-executor
#   spiffe://demo.local/subagent/result-formatter
